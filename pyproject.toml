[project]
name = "metesparser"
version = "0.7.1"
description = "Parse metes and bounds legal descriptions from deed PDFs into structured CSV format"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Dominic Fahey", email = "dominic@example.com" }
]
dependencies = [
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "openai>=2.3.0",
    "pypdf>=6.9.2",
    "mp-ocr>=1.0.1",
    "mp-bearing>=1.1.0",
    "mp-parse>=2.0.0",
    "mp-verify>=2.0.0",
    "mp-export>=2.0.0",
    "mp-review>=2.0.0",
]

[project.optional-dependencies]
delivery = ["mp-review[delivery]>=2.0.0"]
geo = ["mp-review[geo]>=2.0.0"]
web-map = ["mp-review[web-map]>=2.0.0"]
vision = ["mp-ocr[vision]>=1.0.1"]
browser-test = ["playwright>=1.49,<2"]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-watcher>=0.4.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.12",
]
gemini = [
    "google-genai>=3.0.0",
]

[project.scripts]
metesparser = "metesparser.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by ruff format)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: slow tests that take longer to run",
    "integration: integration tests across modules",
    "e2e: end-to-end pipeline and CLI tests",
    "regression: regression tests for fixed bugs",
    "curve: curve geometry and parsing tests",
    "validation: ground-truth and schema validation tests",
]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=metesparser",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-fail-under=95",
]

[tool.coverage.run]
core = "sysmon"
disable_warnings = ["no-sysmon"]

[tool.coverage.report]
precision = 2

[tool.coverage.paths]
metesparser = [
    "src/metesparser",
    "**/site-packages/metesparser",
]
mp_bearing = [
    "packages/mp-bearing/src/mp_bearing",
    "**/site-packages/mp_bearing",
]
mp_export = [
    "packages/mp-export/src/mp_export",
    "**/site-packages/mp_export",
]
mp_models = [
    "packages/mp-models/src/mp_models",
    "**/site-packages/mp_models",
]
mp_ocr = [
    "packages/mp-ocr/src/mp_ocr",
    "**/site-packages/mp_ocr",
]
mp_parse = [
    "packages/mp-parse/src/mp_parse",
    "**/site-packages/mp_parse",
]
mp_review = [
    "packages/mp-review/src/mp_review",
    "**/site-packages/mp_review",
]
mp_verify = [
    "packages/mp-verify/src/mp_verify",
    "**/site-packages/mp_verify",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["google", "google.*"]
ignore_missing_imports = true

[tool.uv]
constraint-dependencies = [
    "urllib3>=2.6.0",
]

[tool.uv.sources]
mp-models = { workspace = true }
mp-bearing = { workspace = true }
mp-ocr = { workspace = true }
mp-parse = { workspace = true }
mp-verify = { workspace = true }
mp-export = { workspace = true }
mp-review = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]
