[project]
name = "metesparser"
version = "0.5.0"
description = "Parse metes and bounds legal descriptions from deed PDFs into structured CSV format"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Dominic Fahey", email = "dominic@example.com" }
]
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "openai>=2.3.0",
    "pypdf>=6.1.1",
    "mp-ocr>=1.0.0",
    "mp-bearing>=1.0.0",
    "mp-parse>=1.0.0",
    "mp-verify>=1.0.0",
    "mp-export>=1.0.0",
    "mp-review>=1.0.0",
]

[project.optional-dependencies]
delivery = ["mp-review[delivery]>=1.0.0"]
geo = ["mp-review[geo]>=1.0.0"]
web-map = ["mp-review[web-map]>=1.0.0"]
browser-test = ["playwright>=1.49,<2"]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-watcher>=0.4.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]
gemini = [
    "google-genai>=0.3.0",
]

[project.scripts]
metesparser = "metesparser.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"src/metesparser/prompts" = "metesparser/prompts"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["src/metesparser/text_parser.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by ruff format)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=src/metesparser",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.uv.sources]
mp-models = { workspace = true }
mp-bearing = { workspace = true }
mp-ocr = { workspace = true }
mp-parse = { workspace = true }
mp-verify = { workspace = true }
mp-export = { workspace = true }
mp-review = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]
